<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1117">
<title>Lista de precios</title>
<style>
:root{
  --bg:#0f1117; --bg2:#161922; --card:#1b1f2b; --card2:#232838;
  --fg:#e8ebf2; --dim:#98a1b5; --dim2:#6c7488;
  --line:#2a2f40; --acc:#4f9cf9; --acc2:#7c5cff;
  --ok:#31d68f; --warn:#ffb347; --bad:#ff6b6b;
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  padding-bottom:40px;
}
a{color:var(--acc)}

/* ---------- header ---------- */
header{
  position:sticky; top:0; z-index:20;
  background:rgba(15,17,23,.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  padding:10px 14px 8px;
}
.hrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
h1{font-size:19px;margin:0;letter-spacing:-.3px}
.sub{font-size:12px;color:var(--dim2);margin-left:auto;text-align:right;line-height:1.25}

.search{position:relative;margin-top:9px}
.search input{
  width:100%; padding:12px 38px 12px 38px; font-size:16px;
  background:var(--card); border:1px solid var(--line); color:var(--fg);
  border-radius:12px; outline:none;
}
.search input:focus{border-color:var(--acc)}
.search .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--dim2);font-size:15px}
.search .clr{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:0;color:var(--dim2);font-size:19px;cursor:pointer;padding:4px 8px;display:none
}

.filters{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
select{
  appearance:none; background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2398a1b5'/></svg>") no-repeat right 10px center;
  border:1px solid var(--line); color:var(--fg); border-radius:10px;
  padding:9px 28px 9px 11px; font-size:13.5px; white-space:nowrap; flex:0 0 auto; cursor:pointer;
}
select.on{border-color:var(--acc);color:var(--acc)}
select option{background:var(--bg2)}

.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto; padding:6px 11px; border-radius:999px; font-size:12.5px;
  background:var(--card); border:1px solid var(--line); color:var(--dim);
  cursor:pointer; user-select:none;
}
.chip.on{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff;font-weight:600}
.chip.of.on{background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff}
.tag.of{background:rgba(245,158,11,.16);color:#fbbf24;border-color:rgba(245,158,11,.4);font-weight:600}
.tools button.of{border-color:rgba(245,158,11,.45);color:#fbbf24}
.tools button.of.on{background:linear-gradient(135deg,#f59e0b,#ef4444);border-color:transparent;color:#fff;font-weight:600}

/* ---------- toolbar ---------- */
.tools{
  display:flex;align-items:center;gap:8px;
  padding:9px 14px 0; font-size:12.5px; color:var(--dim);
}
.tools .grow{flex:1}
.tools button{
  background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:9px;padding:6px 10px;font-size:12.5px;cursor:pointer
}
.tools button.on{border-color:var(--acc);color:var(--acc)}

/* ---------- list ---------- */
main{padding:10px 12px 0}
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:9px; overflow:hidden;
}
.card .top{padding:11px 13px 8px; display:flex; gap:9px; align-items:flex-start}
.card .top .t{flex:1;min-width:0}
.card .pname{font-weight:650; font-size:15.5px; line-height:1.25; letter-spacing:-.2px}
.card .cats{font-size:11.5px;color:var(--dim2);margin-top:3px;display:flex;gap:7px;flex-wrap:wrap}
.card .cats .c{background:var(--card2);padding:1px 7px;border-radius:6px}
.card .best{
  text-align:right;white-space:nowrap;flex:0 0 auto
}
.card .best .p{font-size:17px;font-weight:700;color:var(--ok);letter-spacing:-.4px}
.card .best .l{font-size:10.5px;color:var(--dim2);margin-top:1px}

.rows{border-top:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:9px;
  padding:9px 13px; border-top:1px solid var(--line);
  font-size:14px;
}
.rows .row:first-child{border-top:0}
.row .place{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .place .d{font-size:10.5px;color:var(--dim2);display:block;margin-top:1px}
.row .val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.row.cheapest{background:rgba(49,214,143,.07)}
.row.cheapest .val{color:var(--ok)}
.row.priciest .val{color:var(--bad)}
.tag{
  font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  padding:2px 6px;border-radius:5px;background:rgba(49,214,143,.16);color:var(--ok);margin-left:6px
}
.tag.exp{background:rgba(255,107,107,.15);color:var(--bad)}
/* --- fuente del precio: Precios Claros (SEPA) vs relevado a mano --- */
.tag.sepa{background:rgba(79,156,249,.15);color:#7fb8ff}
.tag.man{background:rgba(152,161,181,.14);color:var(--dim)}
.card .cats .c.src{background:rgba(79,156,249,.14);color:#7fb8ff;font-weight:600}
.card.sepacard{border-left:3px solid rgba(79,156,249,.5)}
.tools button.sepa{border-color:rgba(79,156,249,.4);color:#7fb8ff}
.tools button.sepa.on{background:linear-gradient(135deg,#2563eb,#7c5cff);border-color:transparent;color:#fff;font-weight:600}
.tools button.sepa.off{opacity:.5}
.spread{
  padding:7px 13px;font-size:11.5px;color:var(--dim);
  background:var(--card2);display:flex;gap:6px;align-items:center;flex-wrap:wrap
}
.spread b{color:var(--fg)}
.empty{padding:40px 20px;text-align:center;color:var(--dim2);font-size:14px}
.hist{margin-top:2px}
.hist span{color:var(--dim2);font-size:10.5px}
footer{
  padding:20px 16px 30px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.6
}
.stale{border-color:rgba(255,179,71,.35)}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);
  padding:8px 14px;font-size:12px;color:var(--dim);text-align:center;transform:translateY(100%);transition:.2s}
.bar.show{transform:none}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <h1>🛒 Precios</h1>
    <div class="sub" id="metaLine"></div>
  </div>

  <div class="search">
    <span class="ico">🔎</span>
    <input id="q" type="search" placeholder="Buscar producto… (ej: quesito, salchicha)" autocomplete="off" enterkeyhint="search">
    <button class="clr" id="clr">✕</button>
  </div>

  <div class="filters">
    <select id="fLugar"></select>
    <select id="fCat"></select>
    <select id="fFecha"></select>
    <select id="fOrden">
      <option value="az">Orden: A-Z</option>
      <option value="precio-asc">Precio: menor a mayor</option>
      <option value="precio-desc">Precio: mayor a menor</option>
      <option value="dif">Mayor diferencia entre lugares</option>
      <option value="reciente">Actualizado hace poco</option>
    </select>
  </div>

  <div class="chips" id="quick"></div>
</header>

<div class="tools">
  <span class="grow" id="countLine"></span>
  <button id="bSepa" class="sepa on">📋 Precios Claros</button>
  <button id="bOf" class="of">🔎 Ofertas</button>
  <button id="bHist">Historial</button>
  <button id="bCopy">Copiar lista</button>
</div>

<main id="out"></main>

<footer>
  <b>📋 Precios de góndola: Precios Claros (SEPA)</b> — fuente oficial del gobierno<br>
  Datos del <span id="fSepa">—</span> · <span id="fSepaCount"></span><br>
  <b>🗒️ Precios relevados a mano</b> (barrio y familia) · <span id="fMeta"></span><br>
  Los precios cambian; verificá en el local. Los ítems por kilo se muestran con <b>/kg</b>.
</footer>

<div class="bar" id="bar"></div>

};
const ARS = new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:2,maximumFractionDigits:2});
const fmtM = n => ARS.format(Math.round(n));
const fmtF = iso => iso ? iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(2,4) : "";
const UNIT = {kg:" /kg", "100g":" /100g", "3u":" (pack x3)"};
const unitLabel = u => u ? (UNIT[u] || " /" + u) : "";
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
// Escapa texto que viene de los datos antes de meterlo en innerHTML
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// El cliente NO asume el orden de los precios: los ordena el mismo, de menor a mayor.
if(DATA && DATA.productos) DATA.productos.forEach(p=>p.precios.sort((a,b)=>a.precio-b.precio));

/* ---------------- Precios Claros (SEPA) ----------------
   Son ~10.000 productos: no entran en el HTML, se cargan aparte desde catalogo.json.
   Si ese archivo no carga, la web sigue andando con lo relevado a mano. */
const SEP = "sepa", MAN = "manual";
let CAT = null, CAT_AVISO = "";

function expandirCatalogo(j){
  const loc = j.meta.locales.map(l=>l.nombre), cats = j.meta.categorias;
  return { meta: j.meta, productos: j.productos.map(p=>({
    nombre: p.n, cat: cats[p.c] || "Almacén", fuente: SEP, ean: p.e,
    precios: p.p.map(([i,precio])=>({lugar:loc[i], precio, fecha:j.meta.fecha, fuente:SEP}))
             .sort((a,b)=>a.precio-b.precio)
  })) };
}

// La lista que se muestra: la manual siempre; Precios Claros solo si esta prendido y cargo
function listaActual(){ return (S.sepa && CAT) ? DATA.productos.concat(CAT.productos) : DATA.productos; }

function cargarCatalogo(){
  if(typeof fetch !== "function"){ CAT_AVISO = "catálogo no disponible sin conexión"; return 1; }
  fetch("catalogo.json", {cache:"no-cache"})
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{
      CAT = expandirCatalogo(j);
      if(CAT.meta.fecha && CAT.meta.fecha > DATA.meta.fecha_max) DATA.meta.fecha_max = CAT.meta.fecha;
      refrescarFiltros(); render();
    })
    .catch(e=>{ CAT_AVISO = "no se pudo cargar Precios Claros ("+e.message+")"; render(); });
  return 0;
}

function options(sel, arr, label, keep){
  sel.innerHTML = `<option value="">${label}</option>` + arr.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
  if(keep && arr.includes(keep)) sel.value = keep;
}

function buildQuick(){
  const q = document.getElementById("quick");
  const quick = [
    ["🔥 Ofertas","flag:oferta"],
    ["🥬 Verduras","cat:Frutas y verduras"],
    ["🥩 Carne","cat:Fiambres y carnes"],
    ["🧀 Lácteos","cat:Lácteos"],
    ["🥖 Panadería","cat:Panadería"],
    ["🧊 Congelados","cat:Congelados"],
    ["🧽 Limpieza","cat:Limpieza"],
  ];
  q.innerHTML = quick.map(([t,v])=>`<div class="chip${v==="flag:oferta"?" of":""}" data-v="${v}">${t}</div>`).join("");
  q.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const [k,val]=c.dataset.v.split(":");
    const on = c.classList.contains("on");
    q.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
    if(k==="cat"){ S.cat = on ? "" : val; document.getElementById("fCat").value=S.cat; }
    if(k==="lugar"){ S.lugar = on ? "" : val; document.getElementById("fLugar").value=S.lugar; }
    if(k==="flag" && val==="oferta") S.oferta = !on;
    render();
  });
}

function priceOf(p){
  // precio relevante segun filtro de lugar (o el mas barato)
  if(S.lugar){
    const r = p.precios.find(x=>x.lugar===S.lugar);
    return r ? r.precio : null;
  }
  return p.precios[0].precio;
}

function match(p){
  if(p.fuente===SEP && !S.sepa) return false;
  if(S.cat && p.cat!==S.cat) return false;
  if(S.oferta && !p.oferta) return false;
  if(S.lugar && !p.precios.some(x=>x.lugar===S.lugar)) return false;
  if(S.fecha && !p.precios.some(x=>x.fecha>=S.fecha)) return false;
  if(S.q){
    const hay = norm(p.nombre+" "+p.cat+" "+(p.ean||"")+" "+p.precios.map(x=>x.lugar).join(" "));
    const terms = norm(S.q).split(/\s+/).filter(Boolean);
    if(!terms.every(t=>hay.includes(t))) return false;
  }
  return true;
}

// Reconstruye los filtros con todo lo que hay disponible (manual + Precios Claros)
function refrescarFiltros(){
  const todos = listaActual();
  const lugares = [...new Set(todos.flatMap(p=>p.precios.map(x=>x.lugar)))]
    .sort((a,b)=>a.localeCompare(b,"es"));
  const cats = [...new Set(todos.map(p=>p.cat))].sort((a,b)=>{
    const ia = CAT_ORDEN.indexOf(a), ib = CAT_ORDEN.indexOf(b);
    return ((ia<0?99:ia)-(ib<0?99:ib)) || a.localeCompare(b,"es");
  });
  options(document.getElementById("fLugar"), lugares, "Todos los lugares", S.lugar);
  options(document.getElementById("fCat"), cats, "Todas las categorías", S.cat);
  const bS = document.getElementById("bSepa");
  if(bS){
    bS.textContent = "📋 Precios Claros" + (CAT ? ` (${CAT.meta.total_productos.toLocaleString("es-AR")})` : "");
    bS.classList.toggle("on", S.sepa);
    bS.classList.toggle("off", !S.sepa);
  }
  const fS = document.getElementById("fSepa");
  if(fS) fS.textContent = CAT ? fmtF(CAT.meta.fecha) : (CAT_AVISO || "no cargado");
  const fC = document.getElementById("fSepaCount");
  if(fC) fC.textContent = CAT
    ? `${CAT.meta.total_productos.toLocaleString("es-AR")} productos en ${CAT.meta.locales.length} locales · ${CAT.meta.comparables.toLocaleString("es-AR")} comparables entre locales`
    : "";
}

function render(){
  const out = document.getElementById("out");
  let items = listaActual().filter(match);

  if(S.fecha){
    items = items.map(p=>{
      const vis = p.precios.filter(x=>x.fecha>=S.fecha);
      return vis.length ? {...p, precios: vis} : null;
    }).filter(Boolean);
  }

  const withP = items.map(p=>({p, v: priceOf(p)}));
  const ord = {
    "az": (a,b)=> a.p.nombre.localeCompare(b.p.nombre,"es"),
    "precio-asc": (a,b)=> (a.v??9e9)-(b.v??9e9),
    "precio-desc": (a,b)=> (b.v??-1)-(a.v??-1),
    "dif": (a,b)=>{
      const d=x=>x.p.precios.length>1 ? 1-(x.p.precios[0].precio/x.p.precios[x.p.precios.length-1].precio) : -1;
      return d(b)-d(a);
    },
    "reciente": (a,b)=>{
      const d=x=>x.p.precios.reduce((m,r)=>r.fecha>m?r.fecha:m,"");
      return d(b).localeCompare(d(a));
    }
  }[S.orden];
  withP.sort(ord);

  const nSepa = withP.filter(x=>x.p.fuente===SEP).length;
  document.getElementById("countLine").textContent =
    `${withP.length} producto${withP.length===1?"":"s"}` + (S.lugar ? ` en ${S.lugar}` : "") + (S.cat ? ` · ${S.cat}` : "") + (S.oferta ? " · 🔥 solo ofertas" : "") + (CAT ? ` · ${withP.length-nSepa} a mano / ${nSepa} Precios Claros` : "");

  const bOf = document.getElementById("bOf");
  if(bOf){ bOf.textContent = `🔥 Ofertas${N_OF?" ("+N_OF+")":""}`; bOf.classList.toggle("on", S.oferta); }

  if(!withP.length){
    out.innerHTML = `<div class="empty">Nada con esos filtros 🤷<br><span style="font-size:12px">Probá borrar la búsqueda o cambiar el lugar.</span></div>`;
    return;
  }

  out.innerHTML = withP.map(({p})=>{
    const ps = p.precios;
    const min = ps[0].precio, max = ps[ps.length-1].precio;
    const best = ps[0];
    const dif = max-min;
    const pct = min>0 ? (dif/min*100) : 0;
    const em = CAT_EMOJI[p.cat]||"📦";

    const rows = ps.map((r,i)=>{
      let cls = "";
      if(ps.length>1){ if(i===0) cls="cheapest"; else if(i===ps.length-1) cls="priciest"; }
      const tags = [];
      if(ps.length>1 && i===0) tags.push(`<span class="tag">más barato</span>`);
      if(r.oferta) tags.push(`<span class="tag of">🔥 ${r.baja>0 ? "bajó "+r.baja.toFixed(0)+"%" : "oferta"}</span>`);
      if(ps.length>1 && i===ps.length-1 && dif>0) tags.push(`<span class="tag exp">+${fmtM(dif)}</span>`);
      // de donde salio el precio: góndola de cadena (Precios Claros) o relevado a mano
      tags.push(r.fuente===SEP
        ? `<span class="tag sepa">Precios Claros</span>`
        : `<span class="tag man">a mano</span>`);
      let hist = "";
      if(S.hist && r.hist && r.hist.length){
        hist = `<span class="hist"><span>` + r.hist.map(h=>`${fmtM(h.precio)}${esc(unitLabel(h.unidad||""))} (${fmtF(h.fecha)})`).join(" → ") + `</span></span>`;
      }
      const stale = (DATA.meta.fecha_max && r.fecha < DATA.meta.fecha_max) ? " stale" : "";
      return `<div class="row ${cls}">
        <div class="place">${esc(r.lugar)}${tags.join("")}
          <span class="d">${fmtF(r.fecha)}${r.nota?" · "+esc(r.nota):""}</span>${hist}
        </div>
        <div class="val">${fmtM(r.precio)}<span style="font-size:10.5px;color:var(--dim2);font-weight:400">${esc(unitLabel(r.unidad))}</span></div>
      </div>`;
    }).join("");

    let spread = "";
    if(ps.length>1 && dif>0){
      spread = `<div class="spread">💡 Ahorrás <b>${fmtM(dif)}</b> (${pct.toFixed(0)}%) comprando en <b>${esc(best.lugar)}</b></div>`;
    }
    const bestBlock = ps.length>1
      ? `<div class="best"><div class="p">${fmtM(min)}</div><div class="l">mejor precio</div></div>`
      : "";

    return `<div class="card${p.fuente===SEP?" sepacard":""}${ps.length===1&&ps[0].fecha<DATA.meta.fecha_max?" stale":""}">
      <div class="top">
        <div class="t">
          <div class="pname">${esc(p.nombre)}</div>
          <div class="cats"><span class="c">${em} ${esc(p.cat)}</span>${p.fuente===SEP?`<span class="c src">📋 Precios Claros</span>`:""}${ps.length>1?`<span class="c">${ps.length} lugares</span>`:""}</div>
        </div>
        ${bestBlock}
      </div>
      <div class="rows">${rows}</div>
      ${spread}
    </div>`;
  }).join("");
}

function toast(t){
  const b=document.getElementById("bar"); b.textContent=t; b.classList.add("show");
  clearTimeout(b._t); b._t=setTimeout(()=>b.classList.remove("show"),1800);
}

function init(){
  const m = DATA.meta;
  document.getElementById("metaLine").innerHTML =
    `${m.total_productos} productos · ${m.total_lugares} lugares<br>datos ${fmtF(m.fecha_min)} → ${fmtF(m.fecha_max)}`;
  document.getElementById("fMeta").textContent =
    `${m.total_precios} precios en ${m.total_lugares} lugares` +
    (m.registros_historial ? ` · ${m.registros_historial} registros de historial` : "") +
    ` · datos hasta ${fmtF(m.fecha_max)}`;

  refrescarFiltros();   // arma los selects con lo que haya (despues se suman los de Precios Claros)

  const fF = document.getElementById("fFecha");
  fF.innerHTML = `<option value="">Cualquier fecha</option>` +
    m.fechas.slice().reverse().map(f=>`<option value="${f}">desde ${fmtF(f)}</option>`).join("");

  const bind = (id,key)=> document.getElementById(id).onchange = e=>{
    S[key]=e.target.value; e.target.classList.toggle("on", !!e.target.value); render();
  };
  bind("fLugar","lugar"); bind("fCat","cat"); bind("fFecha","fecha"); bind("fOrden","orden");
  document.getElementById("fOrden").value="az";

  const q = document.getElementById("q");
  q.oninput = ()=>{ S.q=q.value; document.getElementById("clr").style.display = q.value?"block":"none"; render(); };
  document.getElementById("clr").onclick = ()=>{ q.value=""; S.q=""; document.getElementById("clr").style.display="none"; q.focus(); render(); };

  document.getElementById("bOf").onclick = ()=>{
    S.oferta = !S.oferta;
    toast(S.oferta
      ? (N_OF ? `Mostrando ${N_OF} producto${N_OF===1?"":"s"} en oferta 🔥` : "No hay ofertas cargadas todavía")
      : "Mostrando todo");
    render();
  };
  document.getElementById("bHist").onclick = e=>{
    S.hist=!S.hist; e.target.classList.toggle("on",S.hist);
    toast(S.hist?"Mostrando historial de precios":"Historial oculto"); render();
  };
  document.getElementById("bCopy").onclick = ()=>{
    const items = listaActual().filter(match);
    const txt = items.map(p=>{
      const r = S.lugar ? p.precios.filter(x=>x.lugar===S.lugar) : p.precios;
      if(!r.length) return null;
      return p.nombre+"\n"+r.map(x=>"  - "+x.lugar+": "+fmtM(x.precio)+" ("+fmtF(x.fecha)+")"
        + (x.fuente===SEP ? " [Precios Claros]" : "")).join("\n");
    }).filter(Boolean).join("\n");
    navigator.clipboard.writeText(txt).then(()=>toast("Lista copiada ✅"),()=>toast("No se pudo copiar"));
  };

  // Precios Claros: se puede sacar de la vista (viene prendido por defecto)
  document.getElementById("bSepa").onclick = ()=>{
    S.sepa = !S.sepa;
    toast(S.sepa
      ? (CAT ? "Mostrando también los precios de Precios Claros 📋" : "Bajando Precios Claros…")
      : "Solo precios relevados a mano 🗒️");
    refrescarFiltros(); render();
  };

  buildQuick();
  render();
  cargarCatalogo();     // ~10.000 productos, se cargan aparte y al llegar refresca la vista
}

init();
</script>
